<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Hub</title>
    <style>
      :root { color-scheme: light dark; --muted: #55555d; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fbfbfa;
        color: #1a1a1c;
        text-align: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #151517; color: #ececee; }
        :root { --muted: #a0a0a8; }
      }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { margin: 0 0 20px; color: var(--muted); max-width: 320px; line-height: 1.5; }
      button {
        font: inherit; font-weight: 500; border: 0; border-radius: 10px;
        padding: 10px 18px; background: #4f46e5; color: #fff; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Hub needs a connection to load your workspace. Check your network and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
