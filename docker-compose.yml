name: hub

services:
  db:
    image: postgres:17-alpine
    container_name: hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    ports:
      - "5434:5432"
    volumes:
      - hub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local email catcher. Start with: docker compose --profile mail up -d
  # Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: hub-mailpit
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  hub_postgres_data:
